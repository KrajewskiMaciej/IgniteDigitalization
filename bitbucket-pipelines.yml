image: mcr.microsoft.com/dotnet/sdk:8.0

pipelines:
  branches:
    live:
      # KROK 1: BACKUP 
      - step:
          name: Backup previous live -> preview
          script:
            - git config --global user.email "pipeline@bitbucket"
            - git config --global user.name "Bitbucket Pipeline"
            - git fetch --unshallow || true
            - git push origin HEAD~1:refs/heads/preview --force

      # KROK 2: BUILD & PACKAGE (Połączone budowanie Frontu i Backendu)
      - step:
          name: Build All & Package
          size: 2x 
          script:
            # 1. Instalacja Node.js 20 (Wymagane przez Vite 7+)
            - apt-get update && apt-get install -y curl zip
            - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            - apt-get install -y nodejs

            # 2. Przywracanie zależności .NET
            - cd DigitalWars.Server
            - dotnet restore

            # 3. Publikacja
            - dotnet publish DigitalWars.Server.csproj -c Release -o ../deployment

            - cd ..

            # 4. Pakowanie gotowej aplikacji
            - cd deployment
            - zip -r ../app.zip .
          artifacts:
            - app.zip

      # KROK 3: DEPLOY
      - step:
          name: Deploy to Azure Web App
          deployment: production
          script:
            # Używamy sprawdzonej wersji Pipe, która wymaga AZURE_APP_ID
            - pipe: atlassian/azure-web-apps-deploy:1.2.4
              variables:
                AZURE_APP_ID: $AZURE_APP_ID
                AZURE_PASSWORD: $AZURE_PASSWORD
                AZURE_TENANT_ID: $AZURE_TENANT_ID
                AZURE_RESOURCE_GROUP: $AZURE_RESOURCE_GROUP
                AZURE_APP_NAME: $AZURE_WEBAPP_NAME
                ZIP_FILE: 'app.zip'