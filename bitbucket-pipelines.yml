image: mcr.microsoft.com/dotnet/sdk:8.0

pipelines:
  branches:
    live:
      - step:
          name: Backup live → preview
          script:
            - git fetch --all
            - git push origin origin/live~1:preview --force

      - parallel:
          # --- PROCES BACKEND ---
          - step:
              name: Build & Deploy Backend
              size: 2x
              caches:
                - dotnetcore
              script:
                - apt-get update && apt-get install -y zip
                - dotnet publish DigitalWars.Server/DigitalWars.Server.csproj -c Release -o ./publish-backend
                # Pakujemy zawartość folderu do pliku w głównym katalogu
                - cd publish-backend && zip -r ../app-backend.zip . && cd ..
                - pipe: microsoft/azure-web-apps-deploy:1.0.3
                  variables:
                    AZURE_APP_ID: $AZURE_APP_ID
                    AZURE_PASSWORD: $AZURE_PASSWORD
                    AZURE_TENANT_ID: $AZURE_TENANT_ID
                    AZURE_RESOURCE_GROUP: $AZURE_RESOURCE_GROUP
                    AZURE_APP_NAME: $AZURE_WEBAPP_BACKEND
                    ZIP_FILE: "app-backend.zip"

          # --- PROCES FRONTEND ---
          - step:
              name: Build & Deploy Frontend
              caches:
                - node
              script:
                # 1. Instalacja Node.js ORAZ zip (niezbędne w tym osobnym kroku)
                - apt-get update && apt-get install -y zip
                - curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y nodejs
                # 2. Build
                - cd digitalwars.client
                - npm ci
                - npm run build
                # 3. Pakowanie (wchodzimy do dist, żeby w ZIPie nie było folderu "dist", tylko sama treść)
                - cd dist && zip -r ../../app-frontend.zip . && cd ../..
                # 4. Deploy (teraz jesteśmy w root, gdzie jest app-frontend.zip)
                - pipe: microsoft/azure-web-apps-deploy:1.0.3
                  variables:
                    AZURE_APP_ID: $AZURE_APP_ID
                    AZURE_PASSWORD: $AZURE_PASSWORD
                    AZURE_TENANT_ID: $AZURE_TENANT_ID
                    AZURE_RESOURCE_GROUP: $AZURE_RESOURCE_GROUP
                    AZURE_APP_NAME: $AZURE_WEBAPP_FRONTEND
                    ZIP_FILE: "app-frontend.zip"