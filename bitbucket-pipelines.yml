image: mcr.microsoft.com/dotnet/sdk:8.0

pipelines:
  branches:
    live:
      # KROK 1: GIT - Backup i synchronizacja
      - step:
          name: Backup previous live → preview
          script:
            - git config --global user.email "pipeline@bitbucket"
            - git config --global user.name "Bitbucket Pipeline"
            - git fetch --unshallow || true
            - git push origin HEAD~1:refs/heads/preview --force

      # KROK 2: FRONTEND - Budowanie
      - step:
          name: Build Frontend
          image: node:20
          caches:
            - node
          script:
            - cd digitalwars.client
            - npm ci
            - npm run build
          artifacts:
            # Przekazujemy folder dist do następnego kroku
            - digitalwars.client/dist/**

      # KROK 3: BACKEND - Budowanie i Pakowanie całości
      - step:
          name: Build Backend & Package
          script:
            # 1. Instalujemy Node.js, bo projekt .esproj go wymaga (nawet przy samym publishu)
            - apt-get update && apt-get install -y nodejs npm

            # 2. Wchodzimy do folderu serwera
            - cd DigitalWars.Server
            - dotnet restore

            # 3. ZMIANA: Wskazujemy konkretny plik .csproj zamiast domyślnego .sln
            # Dzięki temu flaga -o ../deployment zadziała poprawnie
            - dotnet publish DigitalWars.Server.csproj -c Release -o ../deployment
            - cd ..

            # 4. Przenoszenie frontendu (to zostaje bez zmian)
            - mkdir -p deployment/wwwroot
            - cp -r digitalwars.client/dist/* deployment/wwwroot/

            # 5. Pakowanie
            - apt-get install -y zip
            - cd deployment
            - zip -r ../app.zip .
          artifacts:
            - app.zip
      # KROK 4: DEPLOY - Wysyłka na Azure
      - step:
          name: Deploy to Azure Web App
          deployment: production
          script:
            - pipe: atlassian/azure-web-apps-deploy:1.2.4
              variables:
                AZURE_APP_NAME: $AZURE_WEBAPP_NAME
                AZURE_APP_USERNAME: $AZURE_DEPLOY_USER
                AZURE_APP_PASSWORD: $AZURE_DEPLOY_PASSWORD
                ZIP_FILE: 'app.zip'