image: mcr.microsoft.com/dotnet/sdk:8.0

pipelines:
  branches:
    live:
      - step:
          name: Backup live → preview
          script:
            - git fetch --all
            - git push origin origin/live~1:preview --force

      # Uruchomienie równoległe buildu i deployu
      - parallel:
          - step:
              name: Build & Deploy Backend
              size: 2x
              caches:
                - dotnetcore
              script:
                - apt-get update && apt-get install -y zip
                - dotnet publish DigitalWars.Server -c Release -o ./publish-backend
                - cd publish-backend && zip -r ../app-backend.zip . && cd ..
                # Deploy (używamy obrazu azure-cli tylko dla tej części jeśli trzeba, 
                # ale można też zainstalować az cli w locie lub użyć pipe'a)
                - pipe: microsoft/azure-web-apps-deploy:1.0.3
                  variables:
                    AZURE_APP_ID: $AZURE_APP_ID
                    AZURE_PASSWORD: $AZURE_PASSWORD
                    AZURE_TENANT_ID: $AZURE_TENANT_ID
                    AZURE_RESOURCE_GROUP: $AZURE_RESOURCE_GROUP
                    AZURE_APP_NAME: $AZURE_WEBAPP_BACKEND
                    ZIP_FILE: "app-backend.zip"

          - step:
              name: Build & Deploy Frontend
              caches:
                - node
              script:
                - curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y nodejs
                - cd digitalwars.client
                - npm ci
                - npm run build
                - cd dist && zip -r ../../app-frontend.zip . && cd ..
                - pipe: microsoft/azure-web-apps-deploy:1.0.3
                  variables:
                    AZURE_APP_ID: $AZURE_APP_ID
                    AZURE_PASSWORD: $AZURE_PASSWORD
                    AZURE_TENANT_ID: $AZURE_TENANT_ID
                    AZURE_RESOURCE_GROUP: $AZURE_RESOURCE_GROUP
                    AZURE_APP_NAME: $AZURE_WEBAPP_FRONTEND
                    ZIP_FILE: "app-frontend.zip"